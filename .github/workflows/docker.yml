name: Build and push WebHost images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - scripts/check-php2shell.sh
      - .github/workflows/docker.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: "webhost:${{ matrix.php_minor }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php_minor: "8.4"
          - php_minor: "8.3"
          - php_minor: "8.2"
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PHP_VERSION=${{ matrix.php_minor }}
          tags: |
            ghcr.io/vahistar/webhost:${{ matrix.php_minor }}
            ghcr.io/vahistar/webhost:${{ matrix.php_minor }}-latest
          cache-from: type=gha,scope=php-${{ matrix.php_minor }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.php_minor }}
