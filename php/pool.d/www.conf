[www]
user = container
group = container
listen = /home/container/tmp/php-fpm.sock
listen.owner = container
listen.group = container
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[session.save_path] = /home/container/php/sessions
php_admin_value[upload_tmp_dir] = /home/container/tmp
php_admin_value[error_log] = /home/container/logs/php-error.log
php_admin_flag[log_errors] = on
