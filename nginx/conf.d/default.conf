server {
    listen 80;
    server_name _;

    root /home/container/www;
    index index.php index.html index.htm;
    charset utf-8;

    client_max_body_size 100m;
    client_body_timeout 120s;

    #access_log /home/container/logs/naccess.log;
    #error_log  /home/container/logs/nerror.log error;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    include /home/container/nginx/snippets/php-fpm.conf;
    include /home/container/nginx/snippets/security-deny.conf;
}
