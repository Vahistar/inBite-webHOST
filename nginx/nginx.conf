daemon off;
worker_processes auto;
error_log /home/container/logs/nginx-error.log warn;
pid /home/container/tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /home/container/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /home/container/logs/nginx-access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 100m;

    # Pterodactyl: /var is read-only — keep all temp/cache under home
    client_body_temp_path /home/container/tmp/client_body;
    proxy_temp_path       /home/container/tmp/proxy;
    fastcgi_temp_path     /home/container/tmp/fastcgi;
    uwsgi_temp_path       /home/container/tmp/uwsgi;
    scgi_temp_path        /home/container/tmp/scgi;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https   https;
        http    http;
    }

    fastcgi_cache_path /home/container/tmp/fastcgi_cache levels=1:2 keys_zone=WORDPRESS:32m inactive=60m;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";
    fastcgi_cache_use_stale error timeout invalid_header http_500;

    include /home/container/nginx/conf.d/*.conf;
}
